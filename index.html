<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stand Wind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: full-bleed satellite map with a live particle layer; slim readout on top, compact deck at bottom */
:root{
  --ground:#14130f; --panel:rgba(20,19,15,.82); --line:rgba(236,230,214,.16);
  --bone:#ece6d6; --rise:#ff6a5a; --fall:#64b4ff; --dim:#a39d8c; --blaze:#ff6a13;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overscroll-behavior:none;touch-action:none;height:100%;margin:0;background:var(--ground);color:var(--bone);font-family:var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
#map{position:fixed;inset:0;background:#1b1a14}
#flow{position:fixed;inset:0;pointer-events:none;z-index:400}
.leaflet-control-attribution{background:rgba(20,19,15,.55)!important;color:var(--dim)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--dim)!important}
.leaflet-bottom{bottom:var(--deckH,190px)!important}

.top{position:fixed;top:0;left:0;right:0;z-index:500;padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--panel) 60%,transparent);pointer-events:none}
.row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:46px;line-height:.9}
.big small{font-size:20px;color:var(--dim);font-weight:600;margin-left:5px}
.stat{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-family:var(--body);font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.sky{margin-top:8px;display:inline-flex;gap:0;border:1px solid var(--line);border-radius:10px;background:rgba(20,19,15,.7);overflow:hidden;max-width:100%;pointer-events:auto}
.sky>button{background:none;border:0;border-radius:0;color:var(--bone);text-align:left;cursor:pointer;padding:5px 10px;font-family:var(--display);font-size:17px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.sky>button+button{border-left:1px solid var(--line)}
.sky span{display:block;font-family:var(--body);font-size:9px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.sky span::after{content:" ›";color:var(--blaze)}
.sheet-bg{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{touch-action:pan-y;overflow:auto;max-height:100%;width:100%;max-width:440px;background:#1d1b15;border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.sheet h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.01em}
.sheet .sub{font-size:12px;color:var(--dim);margin-top:2px}
.sheet-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.x{font-size:20px;line-height:1;padding:4px 10px}
.suntbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.suntbl th{font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);text-align:left;padding:4px 6px}
.suntbl td{font-family:var(--display);font-size:18px;font-weight:600;padding:8px 6px;border-top:1px solid var(--line)}
.suntbl td.l{font-family:var(--body);font-size:12px;font-weight:500;color:var(--dim)}
.suntbl tr.today td{color:var(--blaze)}
.pchart{width:100%;height:auto;display:block}
.pdays{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px;margin-top:10px}
.pdays div{background:rgba(236,230,214,.06);border-radius:8px;padding:6px 4px;text-align:center}
.pdays b{display:block;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.pdays span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.pdays i{font-style:normal;font-size:11px;color:var(--blaze)}
.sky em{font-style:normal;font-size:13px;color:var(--blaze);margin-left:3px}
.legal{margin-top:4px;font-size:11px;color:var(--dim)}
.status{margin-top:5px;font-size:12px;color:var(--dim)}
.status b{color:var(--blaze);font-weight:600}

/* center reticle like a scope crosshair, with wind speed under it */
.reticle{position:fixed;left:50%;top:calc(50% + var(--dy,0px));z-index:450;transform:translate(-50%,-22px);pointer-events:none;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.reticle svg{display:block;margin:0 auto}
.reticle div{font-family:var(--display);font-weight:600;font-size:18px;margin-top:2px}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:500;padding:18px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,var(--panel) 22%)}
.deck{display:flex;gap:12px;align-items:center}
#dial{width:96px;height:96px;flex:none}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.rel{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.05}
.rel span{display:block;font-family:var(--body);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:500}
.btns{display:flex;gap:7px;flex-wrap:wrap}
button{font-family:var(--body);font-size:13px;font-weight:600;color:var(--bone);background:rgba(236,230,214,.08);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer}
button:disabled{opacity:.6}
button.on{background:var(--blaze);border-color:var(--blaze);color:#1a0d04}
button:focus-visible{outline:2px solid var(--blaze);outline-offset:2px}

.hlbl{margin-top:9px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.hlbl b{color:var(--blaze);font-weight:600}
.hours{touch-action:pan-x;margin-top:5px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:48px;text-align:center;padding:5px 0;border-radius:8px;background:rgba(236,230,214,.06);border:2px solid transparent;color:var(--bone);font:inherit;cursor:pointer}
.hr.sel{background:var(--blaze);border-color:var(--blaze)}
.hr.sel .t,.hr.sel .d,.hr.sel .s{color:#1a0d04}
.hr.sel path{stroke:#1a0d04}.hr.sel path+path{fill:#1a0d04;stroke:none}.hr.sel circle{fill:#fff}
.thermal{margin-top:6px;font-size:13px;font-weight:600;line-height:1.3;max-width:34em}
.thermal b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.01em}
.thermal span{display:block;font-weight:500;color:var(--bone);opacity:.85}
.thermal .lg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-style:normal;font-size:11px;font-weight:500;color:var(--dim)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.sw.lo{background:#2878ff}.sw.hi{background:#ff5a28}
.sw.ln{height:4px;width:18px;border-radius:2px;vertical-align:2px}.sw.ln.rise{background:#ff6a5a}.sw.ln.fall{background:#64b4ff}
.poolTag{transform:translate(-50%,-30px);white-space:nowrap;font:600 12px/1 var(--body);color:#0d1a2a;background:#64b4ff;padding:4px 7px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.thermal.rise{color:var(--rise)} .thermal.fall{color:var(--fall)}
.hr .th{display:none;font-size:10px;font-weight:700;line-height:1;margin-top:2px}
body.thermals .hr .th{display:block}
.hr .th.rise{color:var(--rise)} .hr .th.fall{color:var(--fall)}
.hr.sel .th{color:#1a0d04}
#btnLabels.on{background:rgba(236,230,214,.22);border-color:rgba(236,230,214,.5)}
#btnThermal.on{background:var(--rise);border-color:var(--rise);color:#1a0d04}
#btnThermal.on.fall{background:var(--fall);border-color:var(--fall)}
.viewing{margin-top:6px;font-family:var(--display);font-size:20px;font-weight:700;color:var(--blaze);line-height:1}
.hr .t{font-size:10px;color:var(--dim)}
.hr svg{display:block;margin:2px auto}
.hr .s{font-family:var(--display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.hr .d{font-size:9px;color:var(--dim)}
.me{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--blaze);border:3px solid var(--bone);box-shadow:0 2px 6px rgba(0,0,0,.6);display:grid;place-items:center}
.me svg{transform:rotate(45deg)}
</style>
</head>
<body>
<div id="map"></div>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-hd"><div><h2 id="sheetT"></h2><div class="sub" id="sheetS"></div></div><button type="button" class="x" id="sheetX" aria-label="Close">×</button></div><div id="sheetB"></div></div></div>
<canvas id="flow"></canvas>
<div class="reticle" aria-hidden="true">
  <svg width="44" height="44" viewBox="0 0 44 44"><g stroke="#ece6d6" stroke-width="2.5" stroke-linecap="round"><path d="M22 4 V16 M22 28 V40 M4 22 H16 M28 22 H40"/></g><circle cx="22" cy="22" r="2.5" fill="#ece6d6"/></svg>
  <div id="retSpd">-- mph</div>
</div>

<header class="top">
  <div class="row">
    <div class="big" id="dirBig">--<small id="degSmall"></small></div>
    <div class="stat" id="spd">-- mph<span>Wind</span></div>
    <div class="stat" id="gst">--<span>Gusts</span></div>
    <div class="stat" id="tmp">--<span>Temp</span></div>
  </div>
  <div class="sky">
    <button type="button" id="baro">--<span>Pressure</span></button>
    <button type="button" id="rise">--<span>Sunrise</span></button>
    <button type="button" id="set">--<span>Sunset</span></button>
  </div>
  <div class="legal" id="legal"></div>
  <div class="viewing" id="viewing" hidden></div>
  <div class="thermal" id="thermal" hidden></div>
  <div class="status" id="status">Getting your location…</div>
</header>

<section class="bottom" id="deck">
  <div class="deck">
    <svg id="dial" viewBox="0 0 200 200" aria-label="Wind compass">
      <circle cx="100" cy="100" r="94" fill="rgba(20,19,15,.75)" stroke="rgba(236,230,214,.2)" stroke-width="3"/>
      <g id="ring" style="transform-origin:100px 100px">
        <g id="ticks"></g>
        <text x="100" y="44" text-anchor="middle" fill="#ff6a13" font-family="Barlow Condensed" font-weight="700" font-size="28">N</text>
        <text x="160" y="109" text-anchor="middle" fill="#ece6d6" font-family="Barlow Condensed" font-weight="600" font-size="24">E</text>
        <text x="100" y="174" text-anchor="middle" fill="#ece6d6" font-family="Barlow Condensed" font-weight="600" font-size="24">S</text>
        <text x="40" y="109" text-anchor="middle" fill="#ece6d6" font-family="Barlow Condensed" font-weight="600" font-size="24">W</text>
        <g id="arrow" style="transition:transform .6s ease;transform-origin:100px 100px">
          <path d="M100 58 L100 128" stroke="#ece6d6" stroke-width="8" stroke-linecap="round"/>
          <path d="M100 146 L85 122 L115 122 Z" fill="#ece6d6"/>
          <circle cx="100" cy="58" r="9" fill="#ff6a13"/>
        </g>
      </g>
      <path d="M100 2 L91 17 L109 17 Z" fill="#ff6a13" id="facing" opacity="0"/>
    </svg>
    <div class="side">
      <div class="rel" id="rel"><span>Scent drifts toward</span>--</div>
      <div class="btns">
        <button id="btnCompass" type="button">Compass</button>
        <button id="btnGps" type="button" hidden>Back to my spot</button>
        <button id="btnThermal" type="button">Thermals</button>
        <button id="btnLabels" type="button">Roads</button>
        <button id="btnRefresh" type="button">Refresh</button>
      </div>
    </div>
  </div>
  <div class="hlbl">Tap an hour to see that wind on the map</div>
  <div class="hours" id="hours"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const PTS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const card=d=>PTS[Math.round(((d%360)+360)%360/22.5)%16];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SCENT_M=365; // ~400 yards

let map,me,cone,pos=null,src='gps',wx=null,heading=null,compassOn=false,watchId=null,lastFetch=null;

(()=>{let s='';for(let a=0;a<360;a+=15){const r1=a%45?84:76,t=a*Math.PI/180;
 s+=`<line x1="${100+r1*Math.sin(t)}" y1="${100-r1*Math.cos(t)}" x2="${100+92*Math.sin(t)}" y2="${100-92*Math.cos(t)}" stroke="rgba(236,230,214,.4)" stroke-width="${a%45?2:4}"/>`;}
 $('ticks').innerHTML=s;})();

map=L.map('map',{zoomControl:false,minZoom:5,maxZoom:19}).setView([41.03,-94.2],17);
// once you touch, pinch or scroll the map, stop the GPS from re-centering or re-zooming it
let userTouched=false,firstFix=true;
const stopFollow=()=>{userTouched=true;followUntil=0;};
['touchstart','pointerdown','mousedown','wheel'].forEach(ev=>map.getContainer().addEventListener(ev,stopFollow,{passive:true,capture:true}));
map.on('dragstart',stopFollow);
// keep Safari from zooming the whole page (which snaps back) when a pinch lands on the panels
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:18,attribution:'Imagery © Esri · Wind & terrain: Open-Meteo, Copernicus DEM'}).addTo(map);
/* road lines, highway shields, street and town names over the satellite photo, like a hybrid map */
map.createPane('labels');map.getPane('labels').style.zIndex=380;map.getPane('labels').style.pointerEvents='none';
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Reference/';
const labelLayer=L.layerGroup([
  L.tileLayer(ESRI+'World_Transportation/MapServer/tile/{z}/{y}/{x}',{pane:'labels',maxZoom:19,maxNativeZoom:19,opacity:.9}),
  L.tileLayer(ESRI+'World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{pane:'labels',maxZoom:19,maxNativeZoom:19})
]);
let labelsOn=true;try{labelsOn=localStorage.getItem('sw_labels')!=='off';}catch(_){}
function setLabels(on){labelsOn=on;if(on)labelLayer.addTo(map);else map.removeLayer(labelLayer);
  const b=document.getElementById('btnLabels');if(b){b.classList.toggle('on',on);}
  try{localStorage.setItem('sw_labels',on?'on':'off');}catch(_){}}
map.on('click',e=>{src='pin';if(accRing){map.removeLayer(accRing);accRing=null;}setPos(e.latlng.lat,e.latlng.lng,false);});
map.on('zoomstart',()=>{plume=[];});

function dest(lat,lon,brg,m){const R=6371000,d=m/R,b=brg*Math.PI/180,p1=lat*Math.PI/180,l1=lon*Math.PI/180;
 const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(b));
 const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));
 return [p2*180/Math.PI,l2*180/Math.PI];}

const standIcon=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,34],
  html:'<div class="me"><svg width="14" height="16" viewBox="0 0 14 16"><path d="M2 1 V15 M12 1 V15 M2 4 H12 M2 8 H12 M2 12 H12" stroke="#ece6d6" stroke-width="2" fill="none"/></svg></div>'});

let accRing=null,followUntil=0,bestAcc=1e9;
function visDy(){const h1=document.querySelector('.top').offsetHeight,h2=$('deck').offsetHeight;return Math.round((h1-h2)/2);}
function placeReticle(){document.documentElement.style.setProperty('--dy',visDy()+'px');}
function centerOn(ll){const z=firstFix?17:map.getZoom();firstFix=false;map.setView(ll,z,{animate:false});map.panBy([0,-visDy()],{animate:false});}
function setPos(lat,lon,center){
  const moved=!pos||map.distance(pos,[lat,lon])>75;
  pos=[lat,lon]; plume=[]; gpsBtn&&setTimeout(gpsBtn);
  if(!me) me=L.marker(pos,{icon:standIcon,zIndexOffset:1000,interactive:false}).addTo(map); else me.setLatLng(pos);
  if(center) centerOn(pos);
  drawCone();
  if(moved||!lastFetch||Date.now()-lastFetch>10*60e3) fetchWx();
}

let selTime=null; // hourly time string the hunter tapped, null = live
function selIdx(){if(!selTime||!wx)return -1;return wx.hourly.time.indexOf(selTime);}
function view(){
  const j=selIdx();
  if(j<0){const c=wx.current;return{d:c.wind_direction_10m,s:c.wind_speed_10m,g:c.wind_gusts_10m,t:c.temperature_2m,live:true};}
  const h=wx.hourly;return{d:h.wind_direction_10m[j],s:h.wind_speed_10m[j],g:h.wind_gusts_10m[j],t:h.temperature_2m[j],live:false,time:h.time[j]};
}
function spreadDeg(){const v=view();return Math.min(38,16+Math.max(0,v.g-v.s)*1.5);}
function drawCone(){
  if(!pos||!wx) return;
  const to=(view().d+180)%360,sp=spreadDeg(),pts=[pos];
  for(let a=-sp;a<=sp;a+=3) pts.push(dest(pos[0],pos[1],to+a,SCENT_M));
  pts.push(dest(pos[0],pos[1],to+sp,SCENT_M));
  if(cone) cone.setLatLngs(pts);
  else cone=L.polygon(pts,{color:'#ff6a13',weight:1.5,opacity:.55,fillColor:'#ff6a13',fillOpacity:.2,interactive:false}).addTo(map);
  if(typeof drawFlow==='function'&&thermalsOn) drawFlow();
}

async function fetchWx(){
  if(!pos) return;
  $('status').textContent='Updating wind…';
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${pos[0].toFixed(4)}&longitude=${pos[1].toFixed(4)}&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl&daily=sunrise,sunset&wind_speed_unit=mph&temperature_unit=fahrenheit&timezone=auto&forecast_days=6`;
  try{const r=await fetch(u);if(!r.ok)throw 0;wx=await r.json();lastFetch=Date.now();render();return true;}
  catch(e){$('status').innerHTML='<b>No signal for wind data.</b> Tap Refresh when you have bars.';return false;}
}

function render(){
  if(selIdx()<0) selTime=null; // selected hour has passed or vanished
  renderSky();
  const t=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  $('status').innerHTML=`${src==='gps'?('Your GPS spot'+(accRing?` ±${Math.round(accRing.getRadius()*1.094)} yd`:'')):src==='pin'?'Pinned spot':'<b>Map center</b> (location off)'} · updated ${t} · tap map to move · build 11/14h`;
  const c=wx.current,h=wx.hourly,key=c.time.slice(0,13)+':00';let i=h.time.indexOf(key);if(i<0)i=0;
  const arrow=d=>`<svg width="20" height="20" viewBox="0 0 22 22"><g transform="rotate(${d} 11 11)"><path d="M11 3 V17" stroke="#ece6d6" stroke-width="2.2" stroke-linecap="round"/><path d="M11 20 L7 14 H15 Z" fill="#ece6d6"/><circle cx="11" cy="3" r="2.4" fill="#ff6a13"/></g></svg>`;
  const thm=j=>{const q=thermalAt(j,h.wind_speed_10m[j]);return `<div class="th ${q.mode}">${q.mode==='rise'?'▲ rise':'▼ fall'}</div>`;};
  let out=`<button type="button" class="hr" data-t=""><div class="t">Now</div>${arrow(c.wind_direction_10m)}<div class="s">${Math.round(c.wind_speed_10m)}</div><div class="d">${card(c.wind_direction_10m)}</div>${thm(i)}</button>`;
  for(let k=1;k<=18&&i+k<h.time.length;k++){
    const j=i+k,d=h.wind_direction_10m[j];
    const hr=new Date(h.time[j]).toLocaleTimeString([],{hour:'numeric'});
    out+=`<button type="button" class="hr" data-t="${h.time[j]}"><div class="t">${hr}</div>${arrow(d)}<div class="s">${Math.round(h.wind_speed_10m[j])}</div><div class="d">${card(d)}</div>${thm(j)}</button>`;
  }
  $('hours').innerHTML=out;
  applyView();
  startFlow(); placeReticle();
}
function applyView(){
  const v=view(),from=Math.round(v.d),mph=Math.round(v.s);
  $('dirBig').innerHTML=`${card(from)}<small>${from}°</small>`;
  $('spd').innerHTML=`${mph} mph<span>From ${card(from)}</span>`;

/* ===== Thermals =====
   Rising: sun-warmed slopes pull air (and scent) uphill, roughly 1.5 hrs after sunrise until late afternoon while it's warming.
   Falling: cooling air sinks and drains downhill, from late afternoon through the night and into early morning.
   Terrain comes from Open-Meteo's elevation model (about 90 m resolution), so it shows ridges, draws and creek bottoms, not single trees. */
let thermalsOn=false,elev=null,elevBusy=false,tField=[],tParts=[];
const TSTEP=32;
function hourIdx(){const h=wx.hourly;let j=selIdx();if(j<0){j=h.time.indexOf(wx.current.time.slice(0,13)+':00');if(j<0)j=0;}return j;}
function thermalAt(j,wind){
  const h=wx.hourly,d=wx.daily,T=h.temperature_2m;
  const t=new Date(h.time[j]),di=Math.max(0,d.time.indexOf(h.time[j].slice(0,10)));
  const sr=new Date(d.sunrise[di]),ss=new Date(d.sunset[di]);
  const a=T[Math.max(0,j-1)],b=T[Math.min(T.length-1,j+1)],dT=(b-a)/2; // °F per hour
  const afterSR=(t-sr)/36e5,toSS=(ss-t)/36e5;
  let mode,label,strength;
  if(t<sr||t>ss){mode='fall';label='Falling';strength=(t>ss&&(t-ss)/36e5<3)?1:.65;}
  else if(afterSR<1.5&&dT<3){mode='fall';label='Switching soon';strength=.35;}
  else if(toSS<1.5){mode='fall';label='Switching to falling';strength=.6;}
  else if(dT<-1.5){mode='fall';label='Falling (cooling fast)';strength=.5;}
  else{mode='rise';label='Rising';strength=Math.min(1,.5+Math.max(0,dT)*.2);}
  let windNote='';
  if(wind>=12){strength*=.3;windNote='Wind this strong will mostly override thermals.';}
  else if(wind>=7){strength*=.65;windNote='Moderate wind will mix with thermals.';}
  return{mode,label,strength,windNote};
}
async function loadElev(){
  if(elevBusy||!thermalsOn) return;
  const c=map.getCenter(),b=map.getBounds();
  const diag=map.distance(b.getSouthWest(),b.getNorthEast());
  const half=Math.max(650,diag*.65),N=20;
  const dLat=half/111320,dLng=half/(111320*Math.cos(c.lat*Math.PI/180));
  const g={s:c.lat-dLat,n:c.lat+dLat,w:c.lng-dLng,e:c.lng+dLng,N,zoom:map.getZoom()};
  const la=[],lo=[];
  for(let r=0;r<N;r++)for(let k=0;k<N;k++){la.push((g.s+(g.n-g.s)*r/(N-1)).toFixed(5));lo.push((g.w+(g.e-g.w)*k/(N-1)).toFixed(5));}
  elevBusy=true;
  try{
    const chunks=[];for(let i=0;i<la.length;i+=100) chunks.push(fetch(`https://api.open-meteo.com/v1/elevation?latitude=${la.slice(i,i+100).join(',')}&longitude=${lo.slice(i,i+100).join(',')}`).then(r=>{if(!r.ok)throw 0;return r.json();}));
    const z=(await Promise.all(chunks)).flatMap(j=>j.elevation);
    // gradient (rise per meter) toward east (gx) and north (gy) at every node
    const mx=(g.e-g.w)/(N-1)*111320*Math.cos(c.lat*Math.PI/180),my=(g.n-g.s)/(N-1)*111320;
    const Z=(r,k)=>z[Math.max(0,Math.min(N-1,r))*N+Math.max(0,Math.min(N-1,k))];
    g.gx=[];g.gy=[];g.z=z;
    for(let r=0;r<N;r++)for(let k=0;k<N;k++){
      const kx=(k===0||k===N-1)?1:2,ry=(r===0||r===N-1)?1:2;
      g.gx.push((Z(r,k+1)-Z(r,k-1))/(kx*mx));g.gy.push((Z(r+1,k)-Z(r-1,k))/(ry*my));
    }
    g.zmin=Math.min(...z);g.zmax=Math.max(...z);
    elev=g; drawTerrain(); buildTField(); renderThermal();
  }catch(e){ $('thermal').innerHTML='<b>Terrain didn’t load.</b><span>Thermals need a signal once to pull elevation. Toggle again when you have bars.</span>'; }
  elevBusy=false;
}
function gradAt(lat,lng){
  const g=elev;if(!g) return null;
  const fr=(lat-g.s)/(g.n-g.s)*(g.N-1),fk=(lng-g.w)/(g.e-g.w)*(g.N-1);
  if(fr<0||fk<0||fr>g.N-1||fk>g.N-1) return null;
  const r0=Math.min(g.N-2,Math.floor(fr)),k0=Math.min(g.N-2,Math.floor(fk)),tr=fr-r0,tk=fk-k0;
  const bl=a=>{const i=r0*g.N+k0;return a[i]*(1-tr)*(1-tk)+a[i+1]*(1-tr)*tk+a[i+g.N]*tr*(1-tk)+a[i+g.N+1]*tr*tk;};
  return{gx:bl(g.gx),gy:bl(g.gy)};
}
function buildTField(){
  tField=[];if(!elev) return;
  for(let y=0;y<=H+TSTEP;y+=TSTEP){const row=[];for(let x=0;x<=W+TSTEP;x+=TSTEP){
    const ll=map.containerPointToLatLng([x,y]),q=gradAt(ll.lat,ll.lng);
    row.push(q?{x:q.gx,y:-q.gy,m:Math.hypot(q.gx,q.gy)}:null);} tField.push(row);}
  if(!tParts.length) tParts=Array.from({length:Math.round(W*H/2000)},()=>newT(true));
}
function newT(any){return{x:Math.random()*W,y:Math.random()*H,a:any?Math.random()*120|0:0,life:90+Math.random()*80,s:.6+Math.random()*.8,r:Math.random()<.3?2:1.4};}
function needElevReload(){
  if(!thermalsOn) return false; if(!elev) return true;
  const c=map.getCenter(),mr=(elev.n-elev.s)*.25,mk=(elev.e-elev.w)*.25;
  return c.lat<elev.s+mr||c.lat>elev.n-mr||c.lng<elev.w+mk||c.lng>elev.e-mk||map.getZoom()<elev.zoom-1;

map.on('move zoomend',()=>{ if(thermalsOn&&elev) buildTField(); });
map.on('moveend',()=>{ if(needElevReload()) loadElev(); });
/* map layers: terrain shading (low ground blue, high ground warm), thermal flow arrows, and your scent's thermal path */
map.createPane('terrain');map.getPane('terrain').style.zIndex=350;map.getPane('terrain').style.pointerEvents='none';
const thermLayer=L.layerGroup(),flowLayer=L.layerGroup();let shadeImg=null;
function drawTerrain(){
  if(shadeImg){thermLayer.removeLayer(shadeImg);shadeImg=null;}
  const g=elev;if(!g) return;
  const N=g.N,cv2=document.createElement('canvas');cv2.width=N;cv2.height=N;const c2=cv2.getContext('2d'),img=c2.createImageData(N,N);
  const span=Math.max(3,g.zmax-g.zmin);
  const lowC=[40,120,255],midC=[230,220,160],highC=[255,90,40];
  for(let r=0;r<N;r++)for(let k=0;k<N;k++){
    const i=r*N+k,t=(g.z[i]-g.zmin)/span;
    // hillshade: light from the northwest
    const sh=Math.max(-1,Math.min(1,(-g.gx[i]+g.gy[i])*8));
    const a=t<.5?lowC:midC,b=t<.5?midC:highC,u=t<.5?t*2:(t-.5)*2;
    const px=((N-1-r)*N+k)*4; // image rows run north to south
    for(let ch=0;ch<3;ch++) img.data[px+ch]=Math.max(0,Math.min(255,(a[ch]+(b[ch]-a[ch])*u)*(1+sh*.35)));
    img.data[px+3]=g.zmax-g.zmin<3?0:Math.round(255*(.28+Math.abs(t-.5)*.5));
  }
  c2.putImageData(img,0,0);
  const half=.5/(N-1),dla=(g.n-g.s)*half,dlo=(g.e-g.w)*half;
  shadeImg=L.imageOverlay(cv2.toDataURL(),[[g.s-dla,g.w-dlo],[g.n+dla,g.e+dlo]],{pane:'terrain',opacity:.75,interactive:false});
  thermLayer.addLayer(shadeImg);
}
function chev(a,brg,len,col,w,op){
  const tip=dest(a[0],a[1],brg,len),l=dest(tip[0],tip[1],brg+150,len*.38),r=dest(tip[0],tip[1],brg-150,len*.38);
  flowLayer.addLayer(L.polyline([a,tip],{color:col,weight:w,opacity:op,interactive:false,lineCap:'round'}));
  flowLayer.addLayer(L.polyline([l,tip,r],{color:col,weight:w,opacity:op,interactive:false,lineCap:'round',lineJoin:'round'}));
}
function drawFlow(){
  flowLayer.clearLayers();
  const g=elev;if(!g||!wx||!thermalsOn) return;
  const q=thermalAt(hourIdx(),view().s),rise=q.mode==='rise',col=rise?'#ff6a5a':'#64b4ff';
  // arrow field every other grid node
  for(let r=1;r<g.N-1;r+=2)for(let k=1;k<g.N-1;k+=2){
    const i=r*g.N+k,m=Math.hypot(g.gx[i],g.gy[i]);if(m<.006) continue;
    const up=(Math.atan2(g.gx[i],g.gy[i])*180/Math.PI+360)%360,brg=rise?up:(up+180)%360;
    const lat=g.s+(g.n-g.s)*r/(g.N-1),lng=g.w+(g.e-g.w)*k/(g.N-1);
    const cell=(g.n-g.s)*111320/(g.N-1);
    const len=cell*(.3+Math.min(1,m/.08)*.45);
    const a=dest(lat,lng,(brg+180)%360,len/2);
    chev(a,brg,len,col,2,.3+.45*q.strength);
  }
  // your scent's thermal path: follow the slope from the stand
  if(!pos) return;
  const path=[pos];let p=pos,dist=0,pooled=false;
  while(dist<450){
    const gg=gradAt(p[0],p[1]);if(!gg) break;
    const m=Math.hypot(gg.gx,gg.gy);if(m<.004){pooled=true;break;}

  }

    flowLayer.addLayer(L.polyline(path,{color:'#ffffff',weight:3.5,opacity:.95,interactive:false,lineCap:'round',lineJoin:'round',dashArray:'2 8'}));
    flowLayer.addLayer(L.polyline(path,{color:col,weight:3,opacity:.95,interactive:false,lineCap:'round',lineJoin:'round'}));
    for(let n=8;n<path.length;n+=8){const a=path[n-1],b=path[n];

    if(pooled&&!rise) flowLayer.addLayer(L.marker(end,{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],html:'<div class="poolTag">Scent pools here</div>'})}));

}
function renderThermal(){

$('btnThermal').onclick=()=>{thermalsOn=!thermalsOn;if(thermalsOn){tParts=[];if(needElevReload())loadElev();else buildTField();}renderThermal();};
const fmtT=s=>new Date(s).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const shift=(s,min)=>new Date(new Date(s).getTime()+min*60e3);

function pressureSheet(){

function startGps(){
  if(!navigator.geolocation){useCenter();return;}
  src='gps'; if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  followUntil=Date.now()+25000; bestAcc=1e9;
  watchId=navigator.geolocation.watchPosition(p=>{
      if(src==='pin')return; src='gps';
      const a=p.coords.accuracy||0, ll=[p.coords.latitude,p.coords.longitude];
      const recenter=!userTouched&&(firstFix||(Date.now()<followUntil&&a<bestAcc&&a>15)); if(recenter) bestAcc=a;
      setPos(ll[0],ll[1],recenter);
      if(!accRing) accRing=L.circle(ll,{radius:a,color:'#7fb8ff',weight:1,opacity:.7,fillColor:'#7fb8ff',fillOpacity:.12,interactive:false}).addTo(map);
      else {accRing.setLatLng(ll);accRing.setRadius(a);}
      if(Date.now()<followUntil) $('status').textContent=`Locking GPS… ±${Math.round(a*1.094)} yd`;
    },
    ()=>{useCenter();},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function gpsBtn(){$('btnGps').hidden=(src==='gps');}
$('btnGps').onclick=()=>{userTouched=false;src='gps';gpsBtn();$('status').textContent='Finding you…';startGps();};
$('hours').addEventListener('click',e=>{
  const b=e.target.closest('.hr'); if(!b||!wx) return;
  selTime=b.dataset.t||null; applyView();
});
setLabels(labelsOn);$('btnLabels').onclick=()=>setLabels(!labelsOn);
$('btnRefresh').onclick=async()=>{
  const b=$('btnRefresh');b.disabled=true;b.textContent='Updating…';
  const ok=await fetchWx();
  b.textContent=ok?'Updated ✓':'No signal';
  setTimeout(()=>{b.textContent='Refresh';b.disabled=false;},2000);
};
// Android/desktop: compass needs no permission tap, so start it automatically
if(!needsAsk&&('ondeviceorientationabsolute' in window||'ondeviceorientation' in window)) $('btnCompass').click();
setInterval(()=>{if(!document.hidden)fetchWx();},10*60e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&lastFetch&&Date.now()-lastFetch>5*60e3)fetchWx();});

/* particle layer: field dots drift across the whole map, scent plume streams off the stand */
const cv=$('flow'),cx=cv.getContext('2d');let field=[],plume=[],raf=null,W=0,H=0;
function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);
  document.documentElement.style.setProperty('--deckH',($('deck').offsetHeight+4)+'px'); placeReticle();
  field=Array.from({length:Math.round(W*H/1800)},()=>newDot(true)); if(typeof thermalsOn!=='undefined'&&thermalsOn&&elev){tParts=[];buildTField();}}
const COLORS=['255,224,80','255,236,120','196,240,96','170,230,80'];
function newDot(any){return{x:Math.random()*W,y:Math.random()*H,a:any?Math.random()*150|0:0,life:110+Math.random()*90,s:.55+Math.random()*.9,r:Math.random()<.25?1.9:1.3,c:COLORS[Math.random()*4|0]};}
addEventListener('resize',size);size();

function startFlow(){ if(reduce){drawStatic();return;} if(!raf) loop(); }
function drawStatic(){cx.clearRect(0,0,W,H);for(const p of field){cx.fillStyle=`rgba(${p.c},.7)`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();}}
function dot(x,y,r,col,al){
  cx.fillStyle=`rgba(${col},${al*.22})`;cx.beginPath();cx.arc(x,y,r*2.6,0,7);cx.fill();
  cx.fillStyle=`rgba(${col},${al})`;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();
}
function gauss(){return (Math.random()+Math.random()+Math.random()-1.5)/1.5;}
function loop(){
  raf=requestAnimationFrame(loop);
  if(!wx) return;
  const v=view(),to=(v.d+180)*Math.PI/180,mph=Math.min(v.s,30);
  const ux=Math.sin(to),uy=-Math.cos(to),base=.22+mph*.075;
  cx.clearRect(0,0,W,H);
  for(const p of field){
    p.x+=ux*base*p.s;p.y+=uy*base*p.s;p.a++;
    if(p.a>p.life||p.x<-10||p.y<-10||p.x>W+10||p.y>H+10){Object.assign(p,newDot(false));}
    dot(p.x,p.y,p.r,p.c,Math.sin(Math.PI*p.a/p.life)*.85);
  }
  if(thermalsOn&&tField.length){
    const q=thermalAt(hourIdx(),v.s),sign=q.mode==='rise'?1:-1,col=q.mode==='rise'?'255,106,90':'100,180,255';
    for(const p of tParts){
      const cell=(tField[Math.round(p.y/TSTEP)]||[])[Math.round(p.x/TSTEP)];
      let vx=0,vy=0;
      if(cell&&cell.m>.004){const k=sign*q.strength*(.5+Math.min(1,cell.m/.06)*1.6)*p.s/cell.m;vx=cell.x*k;vy=cell.y*k;}
      p.x+=vx;p.y+=vy;p.a++;
      if(p.a>p.life||p.x<-10||p.y<-10||p.x>W+10||p.y>H+10) Object.assign(p,newT(false));
      const flat=!cell||cell.m<=.004;
      dot(p.x,p.y,p.r*(flat&&q.mode==='rise'?1+p.a/p.life:1),col,Math.sin(Math.PI*p.a/p.life)*(.5+.5*q.strength)*(flat?.6:1));
    }
  }
}

startGps();
setTimeout(()=>{ if(!pos) useCenter(); },16000);
</script>
